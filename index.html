<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بجعتي اللؤلؤية ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-blue: #a2d2ff;
            --deep-blue: #2c3e50;
            --pearl: #f8f9fa;
            --glass: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; 
            /* خلفية متدرجة تحاكي انعكاس البجعة في ماء معتم وأزرق فاتح */
            background: linear-gradient(180deg, #1a2a3a 0%, #a2d2ff 100%);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden; touch-action: none; color: white;
        }

        /* إضافة طبقة ضبابية ناعمة لخلق جو خيالي */
        body::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.4) 100%);
            z-index: 0;
        }

        .container {
            text-align: center; 
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px 25px; border-radius: 50px; width: 85%; max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.2); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 10; position: relative;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .image-box {
            width: 260px; height: 260px; border-radius: 50%; 
            margin: 0 auto 30px auto;
            background-size: cover; background-position: center; 
            border: 4px solid var(--pearl);
            box-shadow: 0 0 30px rgba(162, 210, 255, 0.6); 
            transition: all 0.8s ease;
            position: relative;
        }

        /* تأثير التوهج خلف الصورة */
        .image-box::after {
            content: ""; position: absolute; inset: -10px; border-radius: 50%;
            background: rgba(255,255,255,0.1); filter: blur(15px); z-index: -1;
        }

        /* كلاسات الصور */
        .img1 { background-image: url('img1.jpg'); }
        .img2 { background-image: url('img2.jpg'); }
        .img3 { background-image: url('img3.jpg'); }
        .img4 { background-image: url('img4.jpg'); }
        .img5 { background-image: url('img5.jpg'); }
        .img6 { background-image: url('img6.jpg'); }

        #display-text { 
            font-size: 1.3rem; font-weight: 700; color: var(--pearl); 
            margin-bottom: 30px; min-height: 5rem; 
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            line-height: 1.7;
        }

        .btn {
            background: rgba(255, 255, 255, 0.9);
            color: #2c3e50; border: none; padding: 14px 40px; 
            font-size: 1.1rem; font-weight: bold;
            border-radius: 30px; cursor: pointer; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
            transition: 0.4s;
        }

        .btn:hover { 
            transform: scale(1.1); 
            background: var(--pearl);
            box-shadow: 0 15px 25px rgba(255,255,255,0.4);
        }

        .date-display { 
            font-size: 2.2rem; color: #fff; 
            text-shadow: 0 0 15px var(--soft-blue);
            font-weight: bold; display: block; margin-top: 15px; 
        }

        /* تأثيرات الفقاعات والريش */
        .magic { 
            position: absolute; pointer-events: none; 
            z-index: 9999; animation: magicFlow 2.5s ease-out forwards; 
        }
        @keyframes magicFlow { 
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 
            20% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; } 
        }

        .hidden { display: none !important; }

        .final-screen { 
            position: fixed; inset: 0; display: flex; 
            flex-direction: column; justify-content: center; 
            align-items: center; background: radial-gradient(circle, #2c3e50, #1a1a2e); 
            z-index: 100; text-align: center; 
        }
    </style>
</head>
<body>

<audio id="player" loop>
    <source src="space_song.mp3" type="audio/mpeg">
</audio>

<div class="container" id="main-container">
    <div id="image-frame" class="image-box img1"></div>
    <div id="display-text">مستعدة لرحلة في عالمنا الخاص؟ 🦢✨</div>
    <div id="btn-container">
        <button class="btn" id="action-btn" onclick="nextStep()">أكيد مستعدة ❤️</button>
    </div>
</div>
