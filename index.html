<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Swan Legend | أسطورة البجعة</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --p-color: #a2d2ff; 
            --glow: rgba(162, 210, 255, 0.4);
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background: #020617;
            background-image: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #fff; font-family: 'Tajawal', sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
        }

        /* شاشة التحميل */
        #loader {
            position: fixed; inset: 0; background: #020617; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .loader-circle { width: 50px; height: 50px; border: 3px solid var(--glass); border-top-color: var(--p-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* حاوية الصور الملتصقة */
        .elements-wrapper { position: relative; width: 450px; height: 750px; display: flex; justify-content: center; align-items: center; transition: all 1s ease; }
        .mini-frame { position: absolute; width: 85px; height: 85px; border-radius: 18px; overflow: hidden; border: 2px solid var(--p-color); box-shadow: 0 0 15px var(--glow); z-index: 15; opacity: 0.9; }
        .mini-frame img { width: 100%; height: 100%; object-fit: cover; }

        /* الحاوية الرئيسية */
        .master-shield {
            position: relative; width: 420px; height: 680px;
            background: var(--glass); backdrop-filter: blur(30px);
            border-radius: 60px; border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center;
            padding: 35px; z-index: 10;
        }

        .swan-theatre {
            width: 320px; height: 320px; border-radius: 50px; overflow: hidden;
            border: 4px solid var(--p-color); box-shadow: 0 0 50px var(--glow);
            margin-bottom: 25px; background: #000;
        }
        .swan-theatre video { width: 100%; height: 100%; object-fit: cover; }

        .narrative-unit { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .main-message { font-size: 1.25rem; color: var(--p-color); line-height: 1.6; min-height: 3.5em; }
        .date-shimmer { font-family: 'Dancing Script', cursive; font-size: 3rem; margin-top: 10px; text-shadow: 0 0 15px var(--p-color); }
        
        .pearl-btn { padding: 18px 50px; border-radius: 35px; background: #fff; color: #000; font-weight: 800; border: none; cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
        .pearl-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px #fff; }

        /* شاشة مشغل الموسيقى النهائي */
        #swan-player-screen {
            position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95);
            z-index: 5000; display: none; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; transform: scale(1.1); transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .player-card {
            width: 320px; padding: 30px; background: rgba(255,255,255,0.05);
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px); text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .player-disk {
            width: 180px; height: 180px; margin: 0 auto 25px;
            border-radius: 50%; border: 5px solid var(--p-color);
            background: url('pic1.jpg') center/cover; /* يفضل وضع صورة البجعة هنا */
            box-shadow: 0 0 40px var(--glow);
            animation: rotateDisk 10s linear infinite;
        }
        @keyframes rotateDisk { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 20px 0; overflow: hidden; }
        #final-progress { width: 0%; height: 100%; background: var(--p-color); box-shadow: 0 0 10px var(--p-color); }

        .player-controls { display: flex; justify-content: center; gap: 25px; align-items: center; }
        .control-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; opacity: 0.8; transition: 0.3s; }
        .control-btn:hover { opacity: 1; transform: scale(1.2); }
        .play-main { width: 60px; height: 60px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }

        .touch-particle { position: absolute; pointer-events: none; font-size: 18px; z-index: 9000; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-circle"></div>
        <p style="margin-top: 20px; color: var(--p-color);">يتم الآن صيد اللؤلؤ...</p>
    </div>

    <div class="elements-wrapper" id="ui-wrap">
        <div id="side-elements"></div>
        <div class="master-shield">
            <div class="swan-theatre">
                <video id="main-vid" autoplay muted loop playsinline preload="auto">
                    <source src="mam.mp4" type="video/mp4">
                </video>
            </div>
            <div class="narrative-unit">
                <div class="main-message" id="msg"></div>
                <div id="date-box"></div>
            </div>
            <button class="pearl-btn" id="next-btn" onclick="app.next()">ابدئي القصة ✨</button>
        </div>
    </div>

    <div id="swan-player-screen">
        <h2 style="color: var(--p-color); margin-bottom: 30px; font-weight: 300; letter-spacing: 5px;">أُحبكِ للأبد 🦢</h2>
        <div class="player-card">
            <div class="player-disk" id="disk"></div>
            <h3 id="track-name" style="margin-bottom: 5px;">لحن البجعة الهادئ</h3>
            <p style="opacity: 0.5; font-size: 0.8rem;">إهداء إلى لؤلؤتي الغالية</p>
            
            <div class="progress-container">
                <div id="final-progress"></div>
            </div>

            <div class="player-controls">
                <button class="control-btn">⏮</button>
                <button class="control-btn play-main" id="finalPlayBtn">⏸</button>
                <button class="control-btn">⏭</button>
            </div>
        </div>
        <p style="margin-top: 40px; opacity: 0.3; font-size: 0.7rem;">أنتِ أجمل فصل في رواية حياتي</p>
    </div>

    <audio id="bg-audio" loop preload="auto"><source src="space_song.mp3" type="audio/mpeg"></audio>

    <script>
        const video = document.getElementById('main-vid');
        const audio = document.getElementById('bg-audio');

        window.onload = () => {
            setTimeout(() => {
                gsap.to("#loader", { opacity: 0, duration: 1, onComplete: () => {
                    document.getElementById('loader').remove();
                    app.next();
                }});
            }, 2000);
        };

        const sideContainer = document.getElementById('side-elements');
        const myImages = ["pic1.jpg", "pic2.jpg", "pic3.jpg", "pic4.jpg", "pic5.jpg"];
        const positions = [
            { top: '-10px', left: '-30px' }, { top: '220px', left: '-40px' },
            { top: '-20px', right: '-30px' }, { top: '200px', right: '-40px' },
            { bottom: '150px', left: '170px' }
        ];

        positions.forEach((pos, i) => {
            const frame = document.createElement('div');
            frame.className = 'mini-frame';
            Object.assign(frame.style, pos);
            frame.style.transform = `rotate(${Math.random()*30-15}deg)`;
            frame.innerHTML = `<img src="${myImages[i]}" onerror="this.parentNode.style.background='var(--p-color)'">`;
            sideContainer.appendChild(frame);
            anime({ targets: frame, translateY: [-8, 8], duration: 2000+(i*300), direction: 'alternate', loop: true, easing: 'easeInOutSine' });
        });

        function burst(x, y) {
            const icons = ['🤍', '🦢', '✨'];
            for(let i=0; i<6; i++) {
                const span = document.createElement('span');
                span.className = 'touch-particle';
                span.innerHTML = icons[Math.floor(Math.random()*icons.length)];
                span.style.left = x+'px'; span.style.top = y+'px';
                document.body.appendChild(span);
                anime({ targets: span, translateX: anime.random(-100, 100), translateY: anime.random(-100, 100), opacity: [1, 0], scale: [0.5, 1.2], duration: 800, easing: 'easeOutQuad', complete: () => span.remove() });
            }
        }
        window.addEventListener('click', (e) => {
            burst(e.clientX, e.clientY);
            if(audio.paused) { audio.play(); document.getElementById('finalPlayBtn').innerText = "⏸"; }
        });

        const app = {
            step: 0,
            isTyping: false,
            data: [
                { t: "أهلاً بكِ في عالمي الصغير.. مستعدة للرحلة؟", b: "ابدئي القصة ✨" },
                { t: "في عتمة هذه الحياة، كنتِ أنتِ الضوء الهادئ كالبجعة..", b: "وماذا بعد؟" },
                { t: "رقيقة جداً، لكنكِ قوية في قلبي كأمواج البحر الأزرق..", b: "أكمل القصة.." },
                { t: "تذكرين هذا التاريخ؟ اليوم الذي أشرقتِ فيه في كوني..", b: "يوم لا يُنسى ❤️", d: "2025 / 6 / 11" },
                { t: "سأبقى دائماً بجانبكِ، أحميكِ كما يحمي البحر أسرار اللؤلؤ..", b: "أحبكِ للأبد 🤍" }
            ],

            typeWriter(text, elementId) {
                this.isTyping = true;
                let i = 0;
                const el = document.getElementById(elementId);
                el.innerHTML = "";
                const timer = setInterval(() => {
                    if(i < text.length) { el.innerHTML += text.charAt(i); i++; }
                    else { clearInterval(timer); this.isTyping = false; }
                }, 50);
            },

            next() {
                if(this.isTyping) return;
                if(this.step >= this.data.length) {
                    this.showFinale();
                    return;
                }

                const current = this.data[this.step];
                const dateEl = document.getElementById('date-box');
                const btnEl = document.getElementById('next-btn');

                gsap.to(dateEl, { opacity: 0, duration: 0.3 });
                this.typeWriter(current.t, "msg");

                setTimeout(() => {
                    if(current.d) {
                        dateEl.innerHTML = `<div class="date-shimmer">${current.d}</div>`;
                        gsap.to(dateEl, { opacity: 1, duration: 0.8 });
                    }
                    btnEl.innerText = current.b;
                }, 600);

                this.step++;
            },

            showFinale() {
                // أنيميشن اختفاء الواجهة الحالية وظهور المشغل
                gsap.to("#ui-wrap", { opacity: 0, scale: 0.8, duration: 1.5, onComplete: () => {
                    document.getElementById('ui-wrap').style.display = 'none';
                    const finale = document.getElementById('swan-player-screen');
                    finale.style.display = 'flex';
                    setTimeout(() => {
                        finale.style.opacity = '1';
                        finale.style.transform = 'scale(1)';
                    }, 100);
                }});
            }
        };

        // تحديث شريط التقدم في المشغل النهائي
        audio.ontimeupdate = () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            document.getElementById('final-progress').style.width = pct + "%";
        };

        document.getElementById('finalPlayBtn').onclick = () => {
            if(audio.paused) { audio.play(); document.getElementById('finalPlayBtn').innerText = "⏸"; document.getElementById('disk').style.animationPlayState = 'running'; }
            else { audio.pause(); document.getElementById('finalPlayBtn').innerText = "▶"; document.getElementById('disk').style.animationPlayState = 'paused'; }
        };
    </script>
</body>
</html>
