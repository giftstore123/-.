<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أفلان ❤️ أفلانة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --swan-blue: #e1f5fe; /* أزرق فاتح جداً */
            --pearl-white: #fdfcfb; /* أبيض لؤلؤي */
            --soft-blue: #b3e5fc; /* أزرق سماوي ناعم */
            --accent-blue: #81d4fa;
        }

        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; 
            /* خلفية متدرجة بألوان اللؤلؤ والسماء */
            background: linear-gradient(135deg, #fdfcfb 0%, #e1f5fe 100%);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden; touch-action: none; color: #444;
        }

        /* إضافة لمعة خفيفة كالؤلؤ على الخلفية */
        body::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(255,255,255,0.5) 100%);
            pointer-events: none;
        }

        .container {
            text-align: center; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(10px);
            padding: 30px 20px; border-radius: 40px; width: 85%; max-width: 400px;
            box-shadow: 0 15px 35px rgba(179, 229, 252, 0.4); 
            border: 2px solid #ffffff;
            z-index: 10; position: relative;
        }

        .image-box {
            width: 250px; height: 250px; border-radius: 50% 50% 20% 20%; /* شكل انسيابي يشبه البجعة */
            margin: 0 auto 25px auto;
            background-size: cover; background-position: center; 
            border: 5px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* كلاسات الصور */
        .img1 { background-image: url('img1.jpg'); }
        .img2 { background-image: url('img2.jpg'); }
        .img3 { background-image: url('img3.jpg'); }
        .img4 { background-image: url('img4.jpg'); }
        .img5 { background-image: url('img5.jpg'); }
        .img6 { background-image: url('img6.jpg'); }

        #display-text { 
            font-size: 1.2rem; font-weight: 700; color: #546e7a; 
            margin-bottom: 25px; min-height: 4.5rem; 
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(45deg, #81d4fa, #b3e5fc);
            color: white; border: none; padding: 12px 35px; 
            font-size: 1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(129, 212, 250, 0.4); 
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .btn:hover { transform: scale(1.05); background: linear-gradient(45deg, #b3e5fc, #81d4fa); }

        .date-display { 
            font-size: 1.8rem; color: #0288d1; 
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            font-weight: bold; display: block; margin-top: 10px; 
        }

        /* ريش بجعة بدلاً من النجوم */
        .feather { 
            position: absolute; pointer-events: none; 
            font-size: 20px; z-index: 9999; 
            animation: featherFall 2s ease-out forwards; 
        }
        @keyframes featherFall { 
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) rotate(360deg) scale(0); opacity: 0; } 
        }

        .hidden { display: none !important; }

        .final-screen { 
            position: fixed; inset: 0; display: flex; 
            flex-direction: column; justify-content: center; 
            align-items: center; background: #fdfcfb; z-index: 100; text-align: center; 
        }
    </style>
</head>
<body>

<audio id="player" loop>
    <source src="space_song.mp3" type="audio/mpeg">
</audio>

<div class="container" id="main-container">
    <div id="image-frame" class="image-box img1"></div>
    <div id="display-text">أهلاً يا رقيقتي.. جاهزة؟ 🦢</div>
    <div id="btn-container">
        <button class="btn" id="action-btn" onclick="nextStep()">نعم جاهزة ❤️</button>
    </div>
</div>

<div id="final-screen" class="final-screen hidden">
    <div class="image-box img6" style="width:200px; height:200px; border-radius: 50%;"></div>
    <h2 style="color: #0288d1; margin-top:15px;">أنتِ بجعتي الجميلة ❤️</h2>
    <p style="font-size: 1.1rem; color: #78909c;">من أفلان.. للأبد</p>
    <button class="btn" onclick="location.reload()">إعادة الحكاية 🔄</button>
</div>

<script>
    const player = document.getElementById('player');
    let step = 0;

    const content = [
        { t: "أفلانة.. تدرين البجعة ليش ترمز للنقاء والجمال؟", i: "img1", b: "ليش يا أفلان؟" },
        { t: "لأنها تحاول توصل لربع جمالج، بس صعبة عليها!", i: "img2", b:"يا روحيي 🦢" },
        { t: "أنتِ مو بس حبيبتي.. أنتِ اللؤلؤة اللي لكيتها بوسط البحر", i: "img3", b: "فديتك ❤️" },
        { t: "لو خيروني بين كنوز الأرض وبينج أنتِ..", i: "img4", b: "شنو تختار؟" },
        { t: "راح أختار أفلانة وأترك الدنيا كلها تلمع وحدها!", i: "img5", b: "أعشقككك" },
        { 
            t: "تذكرين اليوم اللي صار بي كوننا واحد؟", 
            i: "img3", 
            b: "أحلى تاريخ بحياتي",
            isDateStep: true 
        },
        { t: "خلينا نرقص على أنغام هدوئنا.. مثل البجع..", i: "img6", b: "يلا 🎵" }
    ];

    function nextStep() {
        player.play().catch(() => {});

        if (step >= content.length) {
            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            return;
        }

        const data = content[step];
        const textEl = document.getElementById('display-text');
        const imgEl = document.getElementById('image-frame');
        const btnEl = document.getElementById('action-btn');

        imgEl.className = "image-box " + data.i;
        
        let i = 0;
        textEl.innerHTML = "";
        btnEl.style.display = "none";
        
        function type() {
            if (i < data.t.length) {
                textEl.innerHTML += data.t.charAt(i);
                i++;
                setTimeout(type, 50);
            } else {
                btnEl.style.display = "inline-block";
                btnEl.innerText = data.b;
                
                if(data.isDateStep) {
                    textEl.innerHTML += '<br><span class="date-display">2025 / 6 / 11 <br> <small style="font-size:1rem">بداية حكايتنا</small></span>';
                }
            }
        }
        type();
        step++;
    }

    // تغيير شكل النجوم إلى ريش أو لؤلؤ عند النقر
    function createFeathers(x, y) {
        const icons = ['🦢', '✨', '🤍', '🫧'];
        for (let i = 0; i < 6; i++) {
            const s = document.createElement('div');
            s.innerHTML = icons[Math.floor(Math.random() * icons.length)]; 
            s.className = 'feather';
            s.style.left = x + 'px'; s.style.top = y + 'px';
            const tx = (Math.random() - 0.5) * 300 + 'px';
            const ty = (Math.random() - 0.5) * 300 + 'px';
            s.style.setProperty('--tx', tx); s.style.setProperty('--ty', ty);
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 2000);
        }
    }

    document.addEventListener('mousedown', (e) => createFeathers(e.clientX, e.clientY));
    document.addEventListener('touchstart', (e) => createFeathers(e.touches[0].clientX, e.touches[0].clientY));
</script>
</body>
</html>
