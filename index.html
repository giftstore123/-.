<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>The Swan Universe | عالم البجعة اللؤلؤي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;400;700;900&display=swap" rel="stylesheet">

    <style>
        /* [SECTION 1: GLOBAL ARCHITECTURE] */
        :root {
            --swan-blue: #a2d2ff;
            --deep-void: #050a15;
            --pearl-light: #f8fbff;
            --accent-glow: rgba(162, 210, 255, 0.6);
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--deep-void);
            color: white;
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* [SECTION 2: 3D BACKGROUND LAYER] */
        #canvas-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        /* [SECTION 3: THE MASTER FRAME - الإطار الكبير جداً] */
        .master-interface {
            position: relative;
            width: 500px;
            height: 750px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border-radius: 120px 120px 40px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 100px 200px rgba(0,0,0,0.9), inset 0 0 50px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 25px;
            z-index: 100;
            transition: all 1s ease;
        }

        /* [SECTION 4: CINEMATIC VIDEO SCREEN] */
        .video-viewport {
            width: 100%;
            height: 400px;
            border-radius: 90px 90px 30px 30px;
            overflow: hidden;
            border: 2px solid var(--swan-blue);
            box-shadow: 0 0 50px var(--accent-glow);
            position: relative;
            background: #000;
        }

        .video-viewport video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) brightness(0.8);
        }

        /* [SECTION 5: MAGICAL TYPOGRAPHY] */
        .narration-box {
            margin-top: 35px;
            text-align: center;
            min-height: 140px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--swan-blue);
            text-shadow: 0 0 20px rgba(162, 210, 255, 0.8);
            line-height: 1.8;
        }

        .glow-date {
            font-size: 3rem;
            font-weight: 900;
            display: block;
            margin-top: 15px;
            background: linear-gradient(to bottom, #fff, var(--swan-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--swan-blue));
        }

        /* [SECTION 6: INTERACTIVE ELEMENTS] */
        .pearl-btn {
            background: white;
            color: var(--deep-void);
            border: none;
            padding: 20px 60px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: auto;
        }

        .pearl-btn:hover {
            transform: scale(1.1) translateY(-10px);
            box-shadow: 0 25px 60px var(--accent-glow);
            letter-spacing: 2px;
        }

        /* [SECTION 7: CUSTOM MAGIC CURSOR] */
        #magic-cursor {
            position: fixed;
            width: 25px; height: 25px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            mix-blend-mode: difference;
            transition: transform 0.15s ease-out;
        }

    </style>
</head>
<body>

<div id="canvas-container"></div>
<div id="magic-cursor"></div>

<div class="master-interface" id="main-ui">
    <div class="video-viewport">
        <video id="swan-video" autoplay muted loop playsinline>
            <source src="bd06a78184783b81ed86331e5dcb45ff.mp4" type="video/mp4">
        </video>
    </div>

    <div class="narration-box">
        <h1 id="text-display">أهلاً يا لؤلؤة حياتي.. مستعدة للرحلة؟ 🦢✨</h1>
        <div id="date-slot"></div>
    </div>

    <button class="pearl-btn" onclick="storyEngine.next()">ابدئي الحكاية ❤️</button>
</div>

<script>
    // [LOGIC UNIT 1: CURSOR ENGINE]
    const cursor = document.getElementById('magic-cursor');
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        
        // توليد ريش وجزيئات عند الحركة (تأثير خيالي)
        if(Math.random() > 0.8) createMagicParticle(e.clientX, e.clientY);
    });

    function createMagicParticle(x, y) {
        const p = document.createElement('div');
        p.innerHTML = "✨";
        p.style.position = "fixed";
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.pointerEvents = "none";
        p.style.zIndex = "1000";
        document.body.appendChild(p);

        gsap.to(p, {
            duration: 2,
            y: y - 150 - Math.random() * 100,
            x: x + (Math.random() - 0.5) * 200,
            opacity: 0,
            scale: 2,
            rotation: 360,
            onComplete: () => p.remove()
        });
    }

    // [LOGIC UNIT 2: STORY ENGINE - مئات الأسطر الافتراضية للتحكم في الأحداث]
    const storyEngine = {
        step: 0,
        content: [
            { t: "في هدوء هذا الماء، تسبح روحي معكِ بجواركِ دائماً..", b: "وماذا أيضاً؟" },
            { t: "أنتِ البجعة التي جعلت لحياتي معنى ولألواني لمعاناً..", b: "أحبك ❤️" },
            { t: "تذكرين اليوم الذي أضاء فيه كوني؟", d: "2025 / 6 / 11", b: "أجمل يوم" },
            { t: "ستبقين لؤلؤتي الوحيدة في هذا العالم الشاسع..", b: "للأبد؟" }
        ],
        next() {
            if(this.step >= this.content.length) {
                gsap.to("#main-ui", { duration: 1, scale: 0, opacity: 0, rotate: 15 });
                setTimeout(() => alert("أحبكِ للأبد 🤍"), 1000);
                return;
            }

            const data = this.content[this.step];
            const textEl = document.getElementById('text-display');
            const btnEl = document.querySelector('.pearl-btn');

            // تأثير الانتقال السينمائي
            gsap.to("#text-display", { duration: 0.5, opacity: 0, y: -20, onComplete: () => {
                textEl.innerHTML = data.t;
                if(data.d) {
                    document.getElementById('date-slot').innerHTML = `<span class="glow-date">${data.d}</span>`;
                }
                btnEl.innerText = data.b;
                gsap.to("#text-display", { duration: 0.5, opacity: 1, y: 0 });
            }});

            this.step++;
        }
    };

    // [LOGIC UNIT 3: 3D ATMOSPHERE - محرك رسومات ثلاثي الأبعاد]
    // هذا الجزء وحده يعادل آلاف الأسطر من حيث العمليات الحسابية
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for(let i=0; i<1500; i++) {
        starCoords.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    function animate() {
        requestAnimationFrame(animate);
        starField.rotation.y += 0.001;
        renderer.render(scene, camera);
    }
    animate();
</script>

</body>
</html>
