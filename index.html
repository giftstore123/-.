<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Swan Legend | أسطورة البجعة</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --p-color: #a2d2ff; 
            --glow: rgba(162, 210, 255, 0.4);
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background: #020617;
            background-image: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #fff; font-family: 'Tajawal', sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
        }

        /* شاشة التحميل الذكية */
        #loader {
            position: fixed; inset: 0; background: #020617; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease;
        }
        .loader-circle {
            width: 60px; height: 60px; border: 4px solid var(--glass);
            border-top-color: var(--p-color); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* حاوية الصور الملتصقة بالفيديو */
        .elements-wrapper {
            position: relative; width: 450px; height: 750px;
            display: flex; justify-content: center; align-items: center;
        }

        .mini-frame {
            position: absolute; width: 85px; height: 85px;
            border-radius: 18px; overflow: hidden;
            border: 2px solid var(--p-color);
            box-shadow: 0 0 15px var(--glow);
            z-index: 15; opacity: 0.9;
        }
        .mini-frame img { width: 100%; height: 100%; object-fit: cover; }

        /* الحاوية الرئيسية (أكبر الآن) */
        .master-shield {
            position: relative; width: 440px; height: 720px;
            background: var(--glass); backdrop-filter: blur(30px);
            border-radius: 60px; border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center;
            padding: 35px; z-index: 10;
        }

        /* الفيديو - حجم أكبر */
        .swan-theatre {
            width: 340px; height: 340px;
            border-radius: 50px; overflow: hidden;
            border: 4px solid var(--p-color);
            box-shadow: 0 0 50px var(--glow);
            margin-bottom: 25px; background: #000;
        }
        .swan-theatre video { width: 100%; height: 100%; object-fit: cover; }

        /* النصوص والزر */
        .narrative-unit { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .main-message { font-size: 1.3rem; color: var(--p-color); line-height: 1.6; min-height: 3.5em; }
        .date-shimmer { font-family: 'Dancing Script', cursive; font-size: 3rem; margin-top: 10px; }
        .pearl-btn {
            padding: 20px 60px; border-radius: 35px;
            background: #fff; color: #000; font-weight: 800;
            border: none; cursor: pointer; font-size: 1.1rem;
        }

        /* إيموجيات اللمس - أصغر وأخف */
        .touch-particle { position: absolute; pointer-events: none; font-size: 20px; z-index: 2000; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-circle"></div>
        <p style="margin-top: 20px; color: var(--p-color); letter-spacing: 2px;">جاري تحضير الأسطورة...</p>
    </div>

    <div class="elements-wrapper">
        <div id="side-elements"></div>

        <div class="master-shield" id="main-ui">
            <div class="swan-theatre">
                <video id="main-vid" autoplay muted loop playsinline preload="auto">
                    <source src="mam.mp4" type="video/mp4">
                </video>
            </div>

            <div class="narrative-unit">
                <div class="main-message" id="msg"></div>
                <div id="date-box"></div>
            </div>

            <button class="pearl-btn" id="next-btn" onclick="app.next()">ابدئي القصة ✨</button>
        </div>
    </div>

    <audio id="bg-audio" loop preload="auto"><source src="space_song.mp3" type="audio/mpeg"></audio>

    <script>
        const video = document.getElementById('main-vid');
        const audio = document.getElementById('bg-audio');

        // 1. نظام التحميل المسبق (Preloader)
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            // تأخير بسيط للتأكد من أن كل شيء استقر
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 1000);
                app.init(); // بدء الموقع
            }, 1500);
        });

        // 2. الصوت والفيديو (تشغيل مستمر)
        function startMedia() {
            audio.play().catch(() => console.log("Audio needs interaction"));
            if(video.paused) video.play();
        }

        // 3. الصور الجانبية (قريبة جداً مبعثرة حول الفيديو)
        const sideContainer = document.getElementById('side-elements');
        const myImages = ["pic1.jpg", "pic2.jpg", "pic3.jpg", "pic4.jpg", "pic5.jpg"];
        // إحداثيات نسبة إلى wrapper (حول الفيديو)
        const positions = [
            { top: '-20px', left: '-40px' }, { top: '220px', left: '-50px' },
            { top: '-30px', right: '-40px' }, { top: '200px', right: '-50px' },
            { top: '350px', left: '180px' }
        ];

        positions.forEach((pos, i) => {
            const frame = document.createElement('div');
            frame.className = 'mini-frame';
            Object.assign(frame.style, pos);
            frame.style.transform = `rotate(${Math.random()*30-15}deg)`;
            frame.innerHTML = `<img src="${myImages[i]}" onerror="this.parentNode.style.background='var(--p-color)'">`;
            sideContainer.appendChild(frame);
            
            anime({
                targets: frame,
                translateY: [-8, 8],
                duration: 2000 + (i*300),
                direction: 'alternate',
                loop: true,
                easing: 'easeInOutSine'
            });
        });

        // 4. تأثير اللمس (تقليل العدد والحجم للأداء)
        function burst(x, y) {
            startMedia(); // محاولة تشغيل الصوت مع كل لمسة لضمان عمله
            const icons = ['🤍', '🦢', '✨'];
            for(let i=0; i<6; i++) { // تقليل العدد لـ 6 فقط لمنع التعليق
                const span = document.createElement('span');
                span.className = 'touch-particle';
                span.innerHTML = icons[Math.floor(Math.random()*icons.length)];
                span.style.left = x+'px'; span.style.top = y+'px';
                document.body.appendChild(span);
                
                anime({
                    targets: span,
                    translateX: anime.random(-100, 100),
                    translateY: anime.random(-100, 100),
                    opacity: [1, 0],
                    scale: [0.5, 1.2],
                    duration: 800,
                    easing: 'easeOutQuad',
                    complete: () => span.remove()
                });
            }
        }
        window.addEventListener('click', (e) => burst(e.clientX, e.clientY));

        // 5. نظام الحوار
        const app = {
            step: 0,
            isTyping: false,
            data: [
                { t: "أهلاً بكِ في عالمي الصغير.. مستعدة للرحلة؟", b: "ابدئي القصة ✨" },
                { t: "في عتمة هذه الحياة، كنتِ أنتِ الضوء الهادئ كالبجعة..", b: "وماذا بعد؟" },
                { t: "رقيقة جداً، لكنكِ قوية في قلبي كأمواج البحر الأزرق..", b: "أكمل القصة.." },
                { t: "تذكرين هذا التاريخ؟ اليوم الذي أشرقتِ فيه في كوني..", b: "يوم لا يُنسى ❤️", d: "2025 / 6 / 11" },
                { t: "سأبقى دائماً بجانبكِ، أحميكِ كما يحمي البحر أسرار اللؤلؤ..", b: "أحبكِ للأبد 🤍" }
            ],

            typeWriter(text, elementId) {
                this.isTyping = true;
                let i = 0;
                const el = document.getElementById(elementId);
                el.innerHTML = "";
                const timer = setInterval(() => {
                    if(i < text.length) {
                        el.innerHTML += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(timer);
                        this.isTyping = false;
                    }
                }, 50);
            },

            init() { this.next(); },

            next() {
                if(this.isTyping) return;
                startMedia();

                if(this.step >= this.data.length) return;

                const current = this.data[this.step];
                const dateEl = document.getElementById('date-box');
                const btnEl = document.getElementById('next-btn');

                gsap.to(dateEl, { opacity: 0, duration: 0.3 });
                this.typeWriter(current.t, "msg");

                setTimeout(() => {
                    if(current.d) {
                        dateEl.innerHTML = `<div class="date-shimmer">${current.d}</div>`;
                        gsap.to(dateEl, { opacity: 1, duration: 0.8 });
                    }
                    btnEl.innerText = current.b;
                }, 600);

                this.step++;
            }
        };
    </script>
</body>
</html>
