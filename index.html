<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسطورة البجعة واللؤلؤ | The Swan Pearl</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --p-color: #a2d2ff; 
            --glow: rgba(162, 210, 255, 0.5);
            --glass: rgba(255, 255, 255, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #fff; font-family: 'Tajawal', sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            touch-action: none;
        }

        /* حاوية الفيديوهات الجانبية */
        #side-videos-container {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
        }

        .mini-video {
            position: absolute; width: 110px; height: 110px;
            border-radius: 25px; overflow: hidden;
            border: 2px solid var(--p-color);
            box-shadow: 0 0 20px var(--glow);
            opacity: 0.6; transform: translateY(0);
        }

        /* الحاوية الرئيسية (المربع ذو الحواف الدائرية) */
        .master-shield {
            position: relative; width: 420px; height: 680px;
            background: var(--glass); backdrop-filter: blur(25px);
            border-radius: 60px; /* حواف دائرية للمربع الكبير */
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            display: flex; flex-direction: column; align-items: center;
            padding: 35px; z-index: 10;
        }

        /* فيديو المركز المربع */
        .swan-theatre {
            width: 300px; height: 300px; /* شكل مربع تماماً */
            border-radius: 45px; /* حواف دائرية للمربع */
            overflow: hidden; position: relative;
            border: 4px solid var(--p-color);
            box-shadow: 0 0 50px var(--glow);
            margin-bottom: 25px;
        }

        .swan-theatre video { width: 100%; height: 100%; object-fit: cover; }

        /* النصوص */
        .narrative-unit { text-align: center; margin-top: 10px; flex-grow: 1; }
        
        .main-message {
            font-size: 1.3rem; font-weight: 700; color: var(--p-color);
            line-height: 1.7; text-shadow: 0 0 10px var(--glow);
        }

        .date-shimmer {
            font-family: 'Dancing Script', cursive; font-size: 3.2rem;
            background: linear-gradient(45deg, #fff, var(--p-color), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px var(--glow)); margin-top: 15px;
        }

        /* زر الدخول */
        .pearl-btn {
            padding: 20px 50px; border-radius: 40px;
            background: #fff; color: #020617; font-weight: 900;
            border: none; font-size: 1.2rem; transition: 0.3s;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            cursor: pointer; z-index: 100;
        }

        .pearl-btn:hover { transform: scale(1.05); background: var(--p-color); }

        /* جزيئات اللمس (البجعة والقلوب) */
        .touch-particle {
            position: absolute; pointer-events: none;
            font-size: 28px; z-index: 9999; filter: drop-shadow(0 0 5px white);
        }

        /* شاشة النهاية */
        #finale-screen {
            position: fixed; inset: 0; background: #000; z-index: 2000;
            display: none; flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
        }
    </style>
</head>
<body>

    <div id="side-videos-container"></div>

    <div class="master-shield" id="main-ui">
        <div class="swan-theatre">
            <video id="main-vid" autoplay muted loop playsinline>
                <source src="mam.mp4" type="video/mp4">
            </video>
        </div>

        <div class="narrative-unit">
            <div class="main-message" id="msg">مرحباً بكِ في عالمي الصغير..</div>
            <div id="date-box"></div>
        </div>

        <button class="pearl-btn" id="next-btn" onclick="app.next()">ابدئي الرحلة 🤍</button>
    </div>

    <div id="finale-screen">
        <h1 style="font-size: 4rem; color: var(--p-color);">أحبكِ للأبد 🤍</h1>
        <p style="opacity: 0.7; margin-top: 20px;">أنتِ أجمل لؤلؤة في هذا البحر</p>
        <button class="pearl-btn" style="margin-top: 40px;" onclick="location.reload()">إعادة القصة 🔄</button>
    </div>

    <audio id="bg-audio" loop><source src="space_song.mp3" type="audio/mpeg"></audio>

    <script>
        // --- 1. إعداد الفيديوهات الـ 5 الجانبية ---
        const container = document.getElementById('side-videos-container');
        const positions = [
            { x: 8, y: 15 },  { x: 12, y: 70 }, // جهة اليسار
            { x: 82, y: 10 }, { x: 78, y: 45 }, { x: 85, y: 80 } // جهة اليمين
        ];

        positions.forEach((pos, i) => {
            const div = document.createElement('div');
            div.className = 'mini-video';
            div.style.left = pos.x + '%';
            div.style.top = pos.y + '%';
            div.innerHTML = `<video autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;">
                             <source src="mam.mp4" type="video/mp4"></video>`;
            container.appendChild(div);

            // حركة طفو عشوائية لكل فيديو
            anime({
                targets: div,
                translateY: [-15, 15],
                duration: 2000 + (i * 700),
                direction: 'alternate',
                loop: true,
                easing: 'easeInOutQuad'
            });
        });

        // --- 2. تأثير انفجار الإيموجيات عند اللمس ---
        function explosion(x, y) {
            const icons = ['🤍', '🦢', '✨', '🫧', '💎'];
            for(let i=0; i<15; i++) {
                const p = document.createElement('span');
                p.className = 'touch-particle';
                p.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 200 + 50;

                anime({
                    targets: p,
                    translateX: Math.cos(angle) * dist,
                    translateY: Math.sin(angle) * dist,
                    rotate: () => anime.random(-360, 360),
                    opacity: [1, 0],
                    scale: [0.5, 2],
                    duration: 1500,
                    easing: 'easeOutExpo',
                    complete: () => p.remove()
                });
            }
        }

        window.addEventListener('mousedown', (e) => explosion(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => explosion(e.touches[0].clientX, e.touches[0].clientY));

        // --- 3. نظام القصة والتحكم ---
        const app = {
            step: 0,
            data: [
                { t: "في عتمة هذه الحياة، كنتِ أنتِ الضوء الهادئ كالبجعة..", b: "أكمل القصة..", d: "" },
                { t: "رقيقة جداً، لكنكِ قوية في قلبي كأمواج البحر الأزرق..", b: "وماذا بعد؟", d: "" },
                { t: "تذكرين هذا التاريخ؟ اليوم الذي أضاء فيه كوني لأول مرة..", b: "أجمل أيامي ❤️", d: "2025 / 6 / 11" },
                { t: "سأبقى دائماً بجانبكِ، أحميكِ مثلما يحمي البحر أسرار اللؤلؤ..", b: "أحبك كثيراً", d: "" }
            ],

            next() {
                // تشغيل الصوت عند أول ضغطة
                const audio = document.getElementById('bg-audio');
                if(audio.paused) audio.play().catch(e => console.log("Audio play blocked"));

                if(this.step >= this.data.length) {
                    this.end();
                    return;
                }

                const current = this.data[this.step];
                const msgEl = document.getElementById('msg');
                const dateEl = document.getElementById('date-box');
                const btn = document.getElementById('next-btn');

                gsap.to([msgEl, dateEl], { opacity: 0, y: -20, duration: 0.4, onComplete: () => {
                    msgEl.innerText = current.t;
                    dateEl.innerHTML = current.d ? `<div class="date-shimmer">${current.d}</div>` : '';
                    btn.innerText = current.b;
                    gsap.to([msgEl, dateEl], { opacity: 1, y: 0, duration: 0.6, ease: "back.out" });
                }});

                this.step++;
            },

            end() {
                gsap.to("#main-ui", { opacity: 0, scale: 0.5, duration: 1, onComplete: () => {
                    document.getElementById('main-ui').style.display = 'none';
                    const final = document.getElementById('finale-screen');
                    final.style.display = 'flex';
                    gsap.from(final, { opacity: 0, duration: 2 });
                    // انفجارات تلقائية في النهاية
                    setInterval(() => explosion(Math.random()*window.innerWidth, Math.random()*window.innerHeight), 400);
                }});
            }
        };
    </script>
</body>
</html>
