<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Swan Legend | أسطورة البجعة</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --p-color: #a2d2ff; 
            --glow: rgba(162, 210, 255, 0.4);
            --glass: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background: #020617;
            background-image: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #fff; font-family: 'Tajawal', sans-serif;
            overflow: hidden; height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            touch-action: none;
        }

        /* حاوية الصور الجانبية المبعثرة حول المركز */
        #side-elements-container {
            position: absolute; width: 100%; height: 100%;
            z-index: 5; pointer-events: none;
        }

        .mini-frame {
            position: absolute; width: 90px; height: 90px;
            border-radius: 20px; overflow: hidden;
            border: 2px solid var(--p-color);
            box-shadow: 0 0 15px var(--glow);
            opacity: 0.8; will-change: transform;
        }

        .mini-frame img { width: 100%; height: 100%; object-fit: cover; }

        /* الحاوية الرئيسية */
        .master-shield {
            position: relative; width: 400px; height: 650px;
            background: var(--glass); backdrop-filter: blur(25px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            display: flex; flex-direction: column; align-items: center;
            padding: 30px; z-index: 10; /* تأكد أن الدرع فوق الصور بقليل أو تحتها حسب الرغبة */
        }

        .swan-theatre {
            width: 280px; height: 280px;
            border-radius: 35px;
            overflow: hidden; position: relative;
            border: 3px solid var(--p-color);
            box-shadow: 0 0 40px var(--glow);
            margin-bottom: 20px;
        }
        .swan-theatre video { width: 100%; height: 100%; object-fit: cover; }

        .music-player {
            width: 100%; background: rgba(255,255,255,0.1);
            padding: 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 12px;
            margin-top: 15px; border: 1px solid rgba(255,255,255,0.05);
        }

        .play-pause-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: #fff; border: none; color: #000;
            font-size: 18px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }

        .track-info { flex: 1; font-size: 0.75rem; }
        .progress-bar {
            width: 100%; height: 4px; background: rgba(255,255,255,0.2);
            border-radius: 5px; margin-top: 6px; overflow: hidden;
        }
        #progress { width: 0%; height: 100%; background: var(--p-color); }

        .narrative-unit { text-align: center; margin-top: 10px; flex: 1; }
        .main-message { font-size: 1.1rem; color: var(--p-color); line-height: 1.6; }
        .date-shimmer { font-family: 'Dancing Script', cursive; font-size: 2.8rem; margin-top: 10px; color: #fff; }

        .pearl-btn {
            padding: 18px 45px; border-radius: 30px;
            background: #fff; color: #000; font-weight: 800;
            border: none; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-top: 15px;
        }

        .touch-particle { position: absolute; pointer-events: none; font-size: 30px; z-index: 1000; }
    </style>
</head>
<body>

    <div id="side-elements-container"></div>

    <div class="master-shield" id="main-ui">
        <div class="swan-theatre">
            <video id="main-vid" autoplay muted loop playsinline>
                <source src="mam.mp4" type="video/mp4">
            </video>
        </div>

        <div class="narrative-unit">
            <div class="main-message" id="msg">مرحباً بكِ يا لؤلؤتي..</div>
            <div id="date-box"></div>
        </div>

        <div class="music-player">
            <button class="play-pause-btn" id="playBtn">▶</button>
            <div class="track-info">
                <span>الموسيقى الهادئة 🎵</span>
                <div class="progress-bar"><div id="progress"></div></div>
            </div>
        </div>

        <button class="pearl-btn" id="next-btn" onclick="app.next()">التالي ✨</button>
    </div>

    <audio id="bg-audio" loop><source src="space_song.mp3" type="audio/mpeg"></audio>

    <script>
        // 1. توزيع الصور بشكل عشوائي "قريب" من المركز
        const sideContainer = document.getElementById('side-elements-container');
        const myImages = ["pic1.jpg", "pic2.jpg", "pic3.jpg", "pic4.jpg", "pic5.jpg"];
        
        // المواقع الآن مركزة أكثر حول المنطقة الوسطى (بين 20% و 80%)
        const positions = [
            { x: 22, y: 15 }, // قريب أعلى يسار
            { x: 18, y: 55 }, // قريب وسط يسار
            { x: 72, y: 20 }, // قريب أعلى يمين
            { x: 75, y: 65 }, // قريب وسط يمين
            { x: 45, y: 82 }  // تحت الصندوق الرئيسي مباشرة
        ];

        positions.forEach((pos, i) => {
            const frame = document.createElement('div');
            frame.className = 'mini-frame';
            frame.style.left = pos.x + '%';
            frame.style.top = pos.y + '%';
            // إضافة دوران عشوائي لتبدو مبعثرة بشكل طبيعي
            const randomRotation = Math.random() * 30 - 15; // بين -15 و 15 درجة
            frame.style.transform = `rotate(${randomRotation}deg)`;

            frame.innerHTML = `<img src="${myImages[i]}" onerror="this.style.display='none'; this.parentNode.style.background='var(--glow)'">`;
            sideContainer.appendChild(frame);

            // حركة طفو عشوائية ناعمة
            anime({
                targets: frame,
                translateY: [-10, 10],
                rotate: [randomRotation, randomRotation + 5],
                duration: 3000 + (i * 500),
                direction: 'alternate',
                loop: true,
                easing: 'easeInOutQuad'
            });
        });

        // 2. مشغل الموسيقى
        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('playBtn');
        const progress = document.getElementById('progress');

        playBtn.onclick = () => {
            if(audio.paused) { audio.play(); playBtn.innerText = "⏸"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        };

        audio.ontimeupdate = () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            progress.style.width = pct + "%";
        };

        // 3. تأثير اللمس (انفجار إيموجيات كثيف)
        function burst(x, y) {
            const icons = ['🤍', '🦢', '✨', '🫧', '💎'];
            for(let i=0; i<15; i++) {
                const span = document.createElement('span');
                span.className = 'touch-particle';
                span.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                span.style.left = x + 'px';
                span.style.top = y + 'px';
                document.body.appendChild(span);

                anime({
                    targets: span,
                    translateX: anime.random(-180, 180),
                    translateY: anime.random(-180, 180),
                    opacity: [1, 0],
                    scale: [0.5, 2],
                    rotate: anime.random(-360, 360),
                    duration: 1200,
                    easing: 'easeOutExpo',
                    complete: () => span.remove()
                });
            }
        }

        window.addEventListener('mousedown', (e) => burst(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => burst(e.touches[0].clientX, e.touches[0].clientY));

        // 4. محرك النصوص
        const app = {
            step: 0,
            data: [
                { t: "في عتمة هذه الحياة، كنتِ أنتِ الضوء..", d: "" },
                { t: "رقيقة كالبجعة، غالية كاللؤلؤ..", d: "" },
                { t: "تذكرين هذا اليوم؟", d: "2025 / 6 / 11" },
                { t: "أحبكِ دائماً وأبداً..", d: "" }
            ],
            next() {
                if(this.step >= this.data.length) {
                    gsap.to("#main-ui", { opacity: 0, scale: 0.9, duration: 1 });
                    return;
                }
                const cur = this.data[this.step];
                gsap.to("#msg, #date-box", { opacity: 0, y: -10, duration: 0.3, onComplete: () => {
                    document.getElementById('msg').innerText = cur.t;
                    document.getElementById('date-box').innerHTML = cur.d ? `<div class="date-shimmer">${cur.d}</div>` : '';
                    gsap.to("#msg, #date-box", { opacity: 1, y: 0, duration: 0.5 });
                }});
                this.step++;
            }
        };
    </script>
</body>
</html>
